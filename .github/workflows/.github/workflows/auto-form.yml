name: Run Auto Google Form

on:
  workflow_dispatch:
    inputs:
      form_url:
        description: 'Nhập URL Google Form của bạn'
        required: true
        type: string
      total_runs:
        description: 'Số lượng lượt chạy mong muốn'
        required: true
        default: '10'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automation script
      env:
        FORM_URL: ${{ github.event.inputs.form_url }}
        TOTAL_RUNS: ${{ github.event.inputs.total_runs }}
      run: python main.py
